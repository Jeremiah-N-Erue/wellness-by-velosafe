version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velosafe
      POSTGRES_PASSWORD: velosafe
      POSTGRES_DB: velosafe
    ports:
      - "5432:5432"
    volumes:
      - velosafe_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velosafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://velosafe:velosafe@db:5432/velosafe?schema=public"
      JWT_SECRET: "change-me-to-a-long-random-string"
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  velosafe_db_data:
